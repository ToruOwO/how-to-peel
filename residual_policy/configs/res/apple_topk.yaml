mode: topk
experiment_name: apple_topk

# ── Data ──────────────────────────────────────────────────────
dataset_path: []
memmap_dir: "/path/to/memmap_apple"
use_memmap: true
fruit: apple
reward_alpha: 0.75

# ── Diffusion policy checkpoint ───────────────────────────────
dp_ckpt: "/path/to/dp_ckpt"

# ── Architecture ──────────────────────────────────────────────
obs_dim: 192
act_dim: 6
reward_feat_dim: 16
reward_model_ckpt: "/path/to/reward_model_ckpt"

# ── TopK filtering ────────────────────────────────────────────
top_rate: 0.5

# ── Training ──────────────────────────────────────────────────
device: cuda:0
seed: 0
batch_size: 256
lr: 0.0001
epochs: 100
lam: 0.5
beta: 2.0
delta_norm_max: 2.0
max_grad_norm: 1.0

# ── Logging ───────────────────────────────────────────────────
entity: ""
project: residual-dp
run_name: apple_topk
save_dir: ./checkpoints
log_every: 100
watch_model: false
