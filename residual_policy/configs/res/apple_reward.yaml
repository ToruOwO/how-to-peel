mode: reward
experiment_name: apple_reward

# ── Data ──────────────────────────────────────────────────────
dataset_path: []           # set if use_memmap=False
memmap_dir: "/path/to/memmap_apple"             # path to pre-built memmap directory
use_memmap: true
fruit: apple
reward_alpha: 0.75

# ── Diffusion policy checkpoint ───────────────────────────────
dp_ckpt: "/path/to/dp_ckpt"                # path to base diffusion policy checkpoint

# ── Architecture ──────────────────────────────────────────────
obs_dim: 192
act_dim: 6
reward_feat_dim: 16
reward_model_ckpt: "/path/to/reward_model_ckpt"      # required for reward mode

# ── Training ──────────────────────────────────────────────────
device: cuda:0
seed: 42
batch_size: 256
num_workers: 8
lr: 0.00005
epochs: 50
lam: 0.7
beta: 2.0
delta_norm_max: 1.0
max_grad_norm: 1.0

# ── Logging ───────────────────────────────────────────────────
entity: ""                 # wandb entity (leave empty for default)
project: residual-dp
run_name: apple_reward
save_dir: ./checkpoints
log_every: 100
watch_model: false
